[workspace]
name = "blop-queueserver-tutorial"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.1"

[dependencies]
ca-certificates = ">=2026.10.19"
python = ">=3.10,<3.13"

[pypi-dependencies]
certifi = ">=2026.10.19"
bluesky-queueserver = "*"
bluesky-queueserver-api = "*"
bluesky-tiled-plugins = "*"
tiled = { version = "*", extras = ["all"] }
ophyd = "*"
