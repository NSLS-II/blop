
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "blop"
description = "Beamline optimization with machine learning"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Max Rakitin", email = "mrakitin@bnl.gov" },
  { name = "Thomas Morris", email = "tmorris@bnl.gov" },
  { name = "Thomas Hopkins", email = "thopkins1@bnl.gov" },
]
maintainers = [
  { name = "Max Rakitin", email = "mrakitin@bnl.gov" },
  { name = "Thomas Morris", email = "tmorris@bnl.gov" },
  { name = "Thomas Hopkins", email = "thopkins1@bnl.gov" },
  { name = "Jessica Moylan", email = "jmoylan1@bnl.gov" },
  { name = "Jennefer Maldonado", email = "jmaldonad@bnl.gov" },
  { name = "Roman Chernikov", email = "rcherniko@bnl.gov" },
]
requires-python = ">=3.11"
dependencies = ["bluesky>=1.14.2", "networkx>=3", "numpy", "rich>=13"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]

[project.optional-dependencies]
ax = ["ax-platform>=1.3.0,<1.4", "botorch>=0.18.0,<0.19.0", "gpytorch", "torch"]
queueserver = ["bluesky-queueserver-api"]
scipy = ["scipy>=1.2.0"]
xopt = ["xopt>3.0.0"]
all = ["blop[ax,queueserver,scipy,xopt]"]
dev = [
  "pip>=26.2.2",
  "pytest",
  "pytest-cov",
  "ipykernel",
  "ruff",
  "nbstripout",
  "pre-commit",
  "coverage",
  "pyright",
  "uv>=0.13.4",
  "virtualenv>=21.14.12",
  "blop[all]",
]
cpu = [
  # Empty extra - the source configuration below routes to CPU-only index
]

[project.urls]
Homepage = "https://github.com/bluesky/blop"
Documentation = "https://blueskyproject.io/blop"
"Bug Reports" = "https://github.com/bluesky/blop/issues"

[tool.hatch]
version.source = "vcs"

[tool.hatch.build]
artifacts = ["src/blop/_version.py"]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.hooks.vcs]
version-file = "src/blop/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
src = ["src", "examples", "docs/source/tutorials"]
line-length = 125
lint.select = [
  "B",       # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "C4",      # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "E",       # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
  "F",       # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
  "W",       # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
  "I",       # isort - https://docs.astral.sh/ruff/rules/#isort-i
  "UP",      # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "SLF",     # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
  "PLC2701", # private import - https://docs.astral.sh/ruff/rules/import-private-name/
  "LOG015",  # root logger call - https://docs.astral.sh/ruff/rules/root-logger-call/
  "S101",    # assert - https://docs.astral.sh/ruff/rules/assert/
  "D",       # docstring - https://docs.astral.sh/ruff/rules/#pydocstyle-d
]
lint.ignore = [
  "SLF001", # private member access
  "B901",   # return-in-generator - https://docs.astral.sh/ruff/rules/return-in-generator/
]
lint.preview = true # so that preview mode PLC2701, and LOG015 is enabled

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/blop/tests/**/*" = ["S101", "SLF001", "D"]
"sim/**/*" = ["D"]
# Ignore F821: undefined name '...' since the ipython profiles are dynamically loaded into the namespace
"docs/**/*" = ["F821", "D"]
"examples/**/*" = ["F821", "D"]

[tool.pyright]
ignore = [
  "sim/",
  "src/blop/tests/",
  "src/blop/bayesian/",           # TODO: Remove this and fix type errors
  "src/blop/ax/qserver_agent.py", # TODO: Remove this and fix type errors
]

[tool.uv]
required-version = ">=0.13.4"

# Configure PyTorch CPU-only installation when [cpu] extra is requested
# This requires uv (https://docs.astral.sh/uv/)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "extra == 'cpu'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true                              # Only use this index for torch-related packages
